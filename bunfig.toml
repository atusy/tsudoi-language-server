# THE DEVELOP-TIME BUILD, AND WHY IT IS HERE RATHER THAN IN A SCRIPT.
#
# examples/ import `@atusy/tsudoi-language-server/deps/types` for their VALUES,
# and every dist/ in this repository is gitignored -- so a clone that has only
# run `bun install` has none at all. The arm that needs tsudoi's is the one that
# SPAWNS DENO: deno takes the exports map's `import` arm to ./dist/deps/types.js
# and fails loudly without it.
#
# RE-MEASURED AFTER THE FRAMEWORK BECAME A WORKSPACE MEMBER, because the causal
# clause this comment used to carry has NO SUBJECT ANY MORE. It said: the root
# tsconfig's `paths` intercepts a self-referencing subpath before the exports
# map, so bun's own loads reach ./src while deno takes the map to ./dist. THERE
# IS NO `paths` MAPPING IN THIS REPOSITORY NOW. What is true instead, measured:
# bun, deno and tsc alike resolve that subpath through node_modules to the
# member's manifest, and the map's `import` and `types` arms send all three to
# dist/ -- so the build below is load-bearing for MORE routes than it was, not
# fewer.
#
# AND WITH dist/ ABSENT THE THREE STOP AGREEING, WHICH IS A NAMED, ACCEPTED
# RESIDUE AND NOT A THING THIS FILE FIXES. MEASURED on a tree with every dist/
# removed: the runtimes fail loudly, but tsc alone probes for the file, falls
# through the map's `default: ./src/*.ts` arm and reads
# packages/tsudoi-language-server/src/types.ts -- exiting with only the two
# errors the HANDLER packages produce, whose own maps name no source arm.
# RE-MEASURED at sprint 58 with the FRAMEWORK'S dist/ alone moved aside, which
# isolates it: tsc then exits 0 with no diagnostic at all.
#
# THE SEPARATE DECISION THIS PARAGRAPH DEFERRED WAS TAKEN, AND IT REFUSED THE
# DELETION. Removing the `default` arms makes the absent state loud -- TS2307
# naming the framework's own subpaths, exactly as a handler already fails -- and
# leaves every reader answering from the same file with the artifact present. It
# is refused by the cost: three arms in this suite reach the framework through a
# probe whose tree has the manifest and a symlinked src/ and NO dist/, so the
# deletion turns graded resolutions into missing files. What landed instead is a
# refusal on the FIFTH check -- `refuseSubpathsAnsweringFromSource` in
# scripts/workspaces.ts -- which is narrower than this residue: it runs AFTER a
# build and says nothing about the bare `tsc --noEmit` this paragraph is about.
#
# AND THE STATE THIS PARAGRAPH DESCRIBES HAS A NAMED PRODUCER, WHERE IT USED TO
# READ AS IF IT TOOK A TARGETED DELETE. MEASURED END TO END at sprint 61 on a
# staged tree nobody had built, tsc 7.0.2 at base 6d1c85d: `bun pm pack` in one
# handler package and then in the other -- each in the member it is documented
# for -- EXITS 0 and produces its tarball, because the prepack compiler answers
# `@atusy/tsudoi-language-server/{types,deps/types,deps/protocol}` from
# packages/tsudoi-language-server/src/*.ts and never notices the artifact it was
# promised is missing. THREE AND NOT TWO, because this trace is the UNION OVER
# BOTH PACKS: ONE handler's own build answers fewer subpaths, which is a
# different measurement, and both are right. After the first pack the root check
# is exit 1 with ONE error; AFTER THE SECOND IT IS EXIT 0 AND SILENT, with
# packages/tsudoi-language-server/dist/ still absent -- the residue above,
# arrived at by two documented commands. THE FRAMEWORK MEMBER IS NAMED AND NOT
# CALLED `this package`: this file sits at the CHECKOUT ROOT, whose own package
# is the private workspace -- it has no tsconfig.build.json, is never built, and
# has no dist/ for any of this to be about.
#
# CONSTRAINED, BECAUSE THE HONEST CLAIM IS NARROWER THAN THE ALARMING ONE: NO
# SINGLE INVOCATION THIS REPOSITORY OWNS PRODUCES THAT STATE. The preload below
# and the fifth check both build the framework member first, and test/helpers/install.ts
# packs the handlers only after the preload has built. What produces it is TWO
# DOCUMENTED COMMANDS IN AN ORDER NOTHING FORBIDS, and nothing runs that route
# today -- so what changed is that the cell no longer needs a hand-made deletion,
# not that anything here reaches it. WHAT WRITES AND WHAT REMOVES A dist/ IS
# ENUMERATED AT `prepareWorkspace` in scripts/workspaces.ts, and what the whole
# arrangement does to the fourth check's colour is at test/helpers/build.ts.
#
# MEASURED ON THIS TREE, AND RECORDED AS WHAT REDDENS RATHER THAN AS A COUNT. A
# number written here goes stale with nobody editing it -- the suite grows and
# the sentence quietly stops being true -- so what is kept is the SHAPE of the
# failure, which does not move. With THE FRAMEWORK MEMBER'S dist/ AND both
# handlers' dist/
# removed and this file absent, much of the suite does not merely fail: it never
# RUNS, because test files fail to LOAD. Load errors standing beside assertion
# failures are what a missing build reads as. THE EXCLUSIVE HALF IS STRUCK: this
# reading took one fault's signature and no survey of faults, and a break in a
# module the test files import widely would read the same. With this file present
# and no build run by hand, the same tree is green.
#
# AND THE FIRST FAILURE IS THE HALF WORTH KEEPING: it names the demo config
# failing to load on `@atusy/tsudoi-completion-path`, a workspace member
# reachable only through the dist/ its own build writes. WHICH failure comes
# first is what points at the cause; HOW MANY there are is a size that changes
# whenever anybody adds a test. RE-MEASURED after the move and unchanged, which
# is worth saying because the reason it holds DID change: a handler is still the
# first to fail, and now for the same reason tsudoi is not -- a handler's
# exports map has no source arm to fall through to.
#
# WHY NOT A `build` SCRIPT: a step a human is trusted to remember reintroduces
# the very staleness this removes -- src/ edited, dist/ not rebuilt, the suite
# green against a module nobody is looking at any more.
#
# WHY `[test] preload` AND NOT THE TOP-LEVEL `preload`: this must run for
# `bun test` and for nothing else. Several tests spawn `bun` to run the CLI or
# a config, and a top-level preload would build once per spawned process and
# make every one of them depend on the compiler.
#
# AND NOTHING ASSERTS THAT THIS PATH RESOLVES, DELIBERATELY, BECAUSE THE FAILURE
# IS LOUD. MEASURED: a `preload` naming a file that does not exist exits 1 -- bun
# refuses to run the suite rather than running it unbuilt. A key whose failure to
# match is silent is worth pinning and this one is not, which is the same reading
# that decides which config keys elsewhere in this repository carry guards.
#
# WHAT THIS DOES NOT REACH, AND IT IS WHY STALENESS IS HANDLED HERE RATHER
# THAN IMPOSSIBLE. Measured across every invocation form:
# `bun test`, `bun test <path>`, `bun test <filter>` and `bun test -t <name>`
# all preload this ONCE, so the single-file bypass the PBI named does not
# exist. But bun discovers bunfig.toml relative to the CURRENT WORKING
# DIRECTORY and does NOT search upward, so `cd test && bun test` runs with no
# build at all. IT ALSO RUNS A DIFFERENT SUITE, which is a second reason that
# route is not the suite and is easy to miss: bun discovers test FILES relative
# to that directory too, so every workspace member's own tests -- which live
# under packages/, not under test/ -- are outside that walk and NONE of them runs.
# The structure is the durable statement and a file count is not: members are
# added and removed, and the containment that makes them invisible is not. On that one route
# staleness is merely handled rather than foreclosed,
# by the comparison in test/package-shape.test.ts between the framework's
# dist/deps/types.js and the names `vscode-languageserver-types` declares -- MEASURED on a tree whose
# dist/deps/types.js has been narrowed to `export {}`, that comparison is the
# failure WRITTEN TO NAME THE BUILD as its cause, where the session tests arrive
# as `initialize failed` from a server whose config could not load. A COUNT OF
# THE OTHERS IS DELIBERATELY NOT CARRIED: it is a size, it moves whenever the
# suite grows, and what makes the comparison worth keeping is which failure
# names the cause. That is why the comparison is still there and was NOT deleted under
# the authorisation the PBI carried. Adding a second bunfig.toml under test/
# would not close this: the set of directories someone can stand in has no end.
#
# ONE THING A READER STANDING HERE NEEDS AND WILL NOT FIND HERE: THE SUITE'S TIME
# LIMIT IS NOT SET IN THIS FILE, AND `bun test --timeout N` NO LONGER REACHES ANY
# FILE THAT CALLS FOR ITSELF. It is set per file by `applySuiteDeadline()` from
# test/helpers/deadline.ts, where the number and both of its bounds are written.
# THE FLAG IS INERT FOR EVERY SWEPT FILE, MEASURED IN BOTH DIRECTIONS: a file
# calling that function with 20_000 passes a 6000ms test under `--timeout 3000`,
# and the same file calling it with 2000 FAILS the same test at 2002ms under
# `--timeout 30000`. That retires the `--timeout 30000` idiom this project used
# through four sprints to tell a machine's red from the code's; the knob that
# still works is TSUDOI_TEST_TIMEOUT_MS.
#
# WHAT `EVERY SWEPT FILE` LEAVES OUT, SAID HERE IN PLAIN WORDS BECAUSE THE
# PARAGRAPH ABOVE READS LIKE A CLAIM ABOUT THE WHOLE RUN AND IS NOT ONE: NO
# SINGLE NUMBER GOVERNS `bun test`. The root run also executes every workspace
# member's own tests, which live under packages/ and are outside the sweep. NOT
# ONE OF THEM CALLS THAT FUNCTION, SO EVERY ONE OF THEM RUNS AT BUN'S OWN
# BUILT-IN 5000ms -- or at whatever `--timeout` says, when one is given. The
# number in test/helpers/deadline.ts is the ROOT suite's deadline and not this
# command's. A member file that ever wanted the project's number would have to
# call for itself like a root file does, and the day one does, the sweep's
# exclusion of the members has to be argued again -- which is what the arm
# `no member's own test spawns` in test/suite-deadline.test.ts exists to force.
#
# AND `NO LONGER DOES ANYTHING` IS WHAT THIS SAID UNTIL IT WAS MEASURED, three
# lines above its own narrow form. THE FLAG STILL BINDS THOSE MEMBER SUITES, and
# nothing else does. RE-MEASURED rather than carried: `bun test
# packages/tsudoi-completion-path/test/resolve.test.ts --timeout 1` exits 1,
# 9 pass / 5 fail, five arms reporting `this test timed out after 1ms`. So the
# flag is a knob over exactly the files nothing else covers, which is the
# opposite of the reading the retired sentence invited.
#
# AND IT IS NOT A SECOND PRELOAD ENTRY, WHICH IS THE OBVIOUS PLACE TO PUT IT AND
# THE ONE THAT DOES NOT WORK. MEASURED on bun 1.3.13: `setDefaultTimeout` called
# from a preload reaches THE FIRST TEST FILE EVALUATED AND NOTHING AFTER IT --
# three files, one 6000ms sleep each, a preload setting 20_000 and nothing else
# in the tree, 1 pass / 2 fail with the later two at `timed out after 5000ms`.
# `beforeAll`, `beforeEach` and `afterAll` registered in the preload all leave
# that reading unchanged, because a test captures its deadline when it is
# REGISTERED, which is module-evaluation time for its own file. `[test] timeout`
# here is ignored outright, which is the same silent-key shape recorded above for
# a preload path that does not resolve -- except that this one is silent.
#
# A SCRATCH FILE IN AN IGNORED DIRECTORY IS NOT PART OF THIS SUITE, AND WITHOUT
# THE KEY BELOW IT WAS. MEASURED on bun 1.3.13: a `.test.ts` planted under
# packages/tsudoi-language-server/__ignored/ RAN in the root suite -- 943 tests
# across 70 files -- while root `tsc --noEmit`, the per-member check, oxlint and
# oxfmt all read it as absent. The globs carry no leading slash and match at any
# depth, which is what `.gitignore`'s own two entries do.
#
# `pathIgnorePatterns` AND NOT `path-ignore-patterns`: the hyphenated form is the
# CLI flag's spelling and this file accepts it in SILENCE, leaving the scratch
# file running. Measured against the camelCase key, which removes it, and against
# the CLI flag as the control that the pattern itself matches.
#
# THE SEGMENTS ARE TIED TO THE WALK THAT SWEEPS THIS SUITE rather than repeated
# there: test/suite-deadline.test.ts reads this line and refuses a disagreement,
# so an edit here cannot leave that walk grading files bun no longer runs.
[test]
preload = ["./test/helpers/build.ts"]
pathIgnorePatterns = ["**/__ignored/**", "**/dist/**"]
