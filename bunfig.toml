# THE DEVELOP-TIME BUILD, AND WHY IT IS HERE RATHER THAN IN A SCRIPT.
#
# examples/ import `@atusy/tsudoi-language-server/deps/types` for their VALUES,
# and every dist/ in this repository is gitignored -- so a clone that has only
# run `bun install` has none at all. The arm that needs tsudoi's is the one that
# SPAWNS DENO: deno takes the exports map's `import` arm to ./dist/deps/types.js
# and fails loudly without it.
#
# RE-MEASURED AFTER THE FRAMEWORK BECAME A WORKSPACE MEMBER, because the causal
# clause this comment used to carry has NO SUBJECT ANY MORE. It said: the root
# tsconfig's `paths` intercepts a self-referencing subpath before the exports
# map, so bun's own loads reach ./src while deno takes the map to ./dist. THERE
# IS NO `paths` MAPPING IN THIS REPOSITORY NOW. What is true instead, measured:
# bun, deno and tsc alike resolve that subpath through node_modules to the
# member's manifest, and the map's `import` and `types` arms send all three to
# dist/ -- so the build below is load-bearing for MORE routes than it was, not
# fewer.
#
# AND WITH dist/ ABSENT THE THREE STOP AGREEING, WHICH IS A NAMED, ACCEPTED
# RESIDUE AND NOT A THING THIS FILE FIXES. MEASURED on a tree with every dist/
# removed: the runtimes fail loudly, but tsc alone probes for the file, falls
# through the map's `default: ./src/*.ts` arm and reads
# packages/tsudoi-language-server/src/types.ts -- exiting with only the two
# errors the HANDLER packages produce, whose own maps name no source arm.
# NOTHING DETECTS THAT FLIP. It is written here because this is the file whose
# absence produces the state, and closing it is a separate decision about that
# `default` arm.
#
# MEASURED ON THIS TREE, AND RECORDED AS WHAT REDDENS RATHER THAN AS A COUNT. A
# number written here goes stale with nobody editing it -- the suite grows and
# the sentence quietly stops being true -- so what is kept is the SHAPE of the
# failure, which does not move. With THIS package's dist/ AND both members' dist/
# removed and this file absent, much of the suite does not merely fail: it never
# RUNS, because test files fail to LOAD. Load errors standing beside assertion
# failures are the signature of a missing build, and no other fault in this
# repository produces it. With this file present and no build run by hand, the
# same tree is green.
#
# AND THE FIRST FAILURE IS THE HALF WORTH KEEPING: it names the demo config
# failing to load on `@atusy/tsudoi-completion-path`, a workspace member
# reachable only through the dist/ its own build writes. WHICH failure comes
# first is what points at the cause; HOW MANY there are is a size that changes
# whenever anybody adds a test. RE-MEASURED after the move and unchanged, which
# is worth saying because the reason it holds DID change: a handler is still the
# first to fail, and now for the same reason tsudoi is not -- a handler's
# exports map has no source arm to fall through to.
#
# WHY NOT A `build` SCRIPT: a step a human is trusted to remember reintroduces
# the very staleness this removes -- src/ edited, dist/ not rebuilt, the suite
# green against a module nobody is looking at any more.
#
# WHY `[test] preload` AND NOT THE TOP-LEVEL `preload`: this must run for
# `bun test` and for nothing else. Several tests spawn `bun` to run the CLI or
# a config, and a top-level preload would build once per spawned process and
# make every one of them depend on the compiler.
#
# WHAT THIS DOES NOT REACH, AND IT IS WHY STALENESS IS HANDLED HERE RATHER
# THAN IMPOSSIBLE. Measured across every invocation form:
# `bun test`, `bun test <path>`, `bun test <filter>` and `bun test -t <name>`
# all preload this ONCE, so the single-file bypass the PBI named does not
# exist. But bun discovers bunfig.toml relative to the CURRENT WORKING
# DIRECTORY and does NOT search upward, so `cd test && bun test` runs with no
# build at all. IT ALSO RUNS A DIFFERENT SUITE, which is a second reason that
# route is not the suite and is easy to miss: bun discovers test FILES relative
# to that directory too, so every workspace member's own tests -- which live
# under packages/, not under test/ -- are outside that walk and NONE of them runs.
# The structure is the durable statement and a file count is not: members are
# added and removed, and the containment that makes them invisible is not. On that one route
# staleness is merely handled rather than foreclosed,
# by the comparison in test/package-shape.test.ts between the framework's
# dist/deps/types.js and the names `vscode-languageserver-types` declares -- MEASURED on a tree whose
# dist/deps/types.js has been narrowed to `export {}`, that comparison is the
# failure WRITTEN TO NAME THE BUILD as its cause, where the session tests arrive
# as `initialize failed` from a server whose config could not load. A COUNT OF
# THE OTHERS IS DELIBERATELY NOT CARRIED: it is a size, it moves whenever the
# suite grows, and what makes the comparison worth keeping is which failure
# names the cause. That is why the comparison is still there and was NOT deleted under
# the authorisation the PBI carried. Adding a second bunfig.toml under test/
# would not close this: the set of directories someone can stand in has no end.
[test]
preload = ["./test/helpers/build.ts"]
