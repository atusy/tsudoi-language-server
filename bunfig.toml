# THE DEVELOP-TIME BUILD, AND WHY IT IS HERE RATHER THAN IN A SCRIPT.
#
# examples/ import `@atusy/tsudoi/types`, which from inside this package
# resolves through package.json's exports map to ./dist/types.js, and dist/ is
# gitignored -- so a clone that has only run `bun install` has no dist/ at all.
#
# MEASURED AT SPRINT 40, ON THIS TREE, and re-measured rather than copied
# because the recorded number had gone stale with nobody editing it: with dist/
# removed and this file absent, `bun test` gives 47 fail / 362 pass / 2 errors
# and 409 of 444 tests even RUN. Sprint 25 recorded 30 fail / 299 pass at
# 9501c68 and that was true then -- the suite has grown by a hundred tests
# since, so the count moved while the sentence around it did not. What DID
# survive re-measurement is the diagnosis: the first failure still names
# dist/types.js imported from examples/completion-path.ts. With this file
# present and no build run by hand, the same tree gives 444 pass.
#
# WHY NOT A `build` SCRIPT: a step a human is trusted to remember reintroduces
# the very staleness this removes -- src/ edited, dist/ not rebuilt, the suite
# green against a module nobody is looking at any more.
#
# WHY `[test] preload` AND NOT THE TOP-LEVEL `preload`: this must run for
# `bun test` and for nothing else. Several tests spawn `bun` to run the CLI or
# a config, and a top-level preload would build once per spawned process and
# make every one of them depend on the compiler.
#
# WHAT THIS DOES NOT REACH, AND IT IS THE REASON PBI-35 WENT BACK TO THE
# PRODUCT OWNER RATHER THAN CLOSING. Measured across every invocation form:
# `bun test`, `bun test <path>`, `bun test <filter>` and `bun test -t <name>`
# all preload this ONCE, so the single-file bypass the PBI named does not
# exist. But bun discovers bunfig.toml relative to the CURRENT WORKING
# DIRECTORY and does NOT search upward, so `cd test && bun test` runs all 444
# tests with no build at all. PBI-35 required staleness to be IMPOSSIBLE rather
# than handled; on that one route it is merely handled, by the dist/-versus-
# src/types.ts comparison in test/package-shape.test.ts -- which is why that
# test is still there and was NOT deleted under the authorisation the PBI
# carried. Adding a second bunfig.toml under test/ would not close this: the
# set of directories someone can stand in has no end.
[test]
preload = ["./test/helpers/build.ts"]
