name: Publish npm alpha

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap tag dispatching, or publish an alpha release
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - publish
      release-tag:
        description: Exact v*-alpha.* tag; required in publish mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-alpha-publish
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Tag-scoped workflow dispatching is now enabled; nothing was published."

  quality:
    if: inputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4
      - name: Install shell test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish xonsh zsh
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install the latest Ox tools
        run: bun add --global oxlint@latest oxfmt@latest
      - name: Report verification tool versions
        run: |
          oxlint --version
          oxfmt --version
      - name: Run the Definition of Done
        run: bun run scripts/definition-of-done.ts

  prepare:
    if: inputs.mode == 'publish'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: "0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          case "$RELEASE_TAG" in
            v*-alpha.*) ;;
            *) echo "release tag must match v*-alpha.*" >&2; exit 1 ;;
          esac
          release_version="$(node -p "require('./packages/tsudoi-language-server/package.json').version")"
          test "$RELEASE_TAG" = "v${release_version}"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_SHA" = "$tag_commit"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify the packaging npm version
        run: test "$(npm --version)" = "11.19.0"

      - name: Pack the release
        run: bun run scripts/pack-release.ts "$RUNNER_TEMP/npm-release"

      - name: Build the immutable release bundle
        run: |
          bundle="$RUNNER_TEMP/npm-release-bundle"
          mkdir -p "$bundle/release" "$bundle/repository/scripts" "$bundle/repository/packages" "$bundle/repository/test/helpers"
          cp -R "$RUNNER_TEMP/npm-release/." "$bundle/release/"
          cp package.json "$bundle/repository/package.json"
          cp scripts/smoke-registry-release.ts scripts/workspaces.ts "$bundle/repository/scripts/"
          cp test/helpers/lsp.ts test/helpers/spawn.ts "$bundle/repository/test/helpers/"
          bun build scripts/publish-release.ts --target=node --outfile "$bundle/repository/scripts/publish-release.js"
          bun build scripts/verify-registry-release.ts --target=node --outfile "$bundle/repository/scripts/verify-registry-release.js"
          for member in packages/*; do
            mkdir -p "$bundle/repository/$member"
            cp "$member/package.json" "$bundle/repository/$member/package.json"
          done
          cd "$bundle"
          # SHA256SUMS is explicitly excluded from find's input set.
          # shellcheck disable=SC2094
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload the release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/npm-release-bundle
          if-no-files-found: error
          retention-days: "1"

  publish:
    if: inputs.mode == 'publish'
    needs: prepare
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the publishing npm version
        run: test "$(npm --version)" = "11.19.0"
      - name: Download the release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release-bundle
      - name: Verify the release bundle
        run: cd "$RUNNER_TEMP/npm-release-bundle" && sha256sum --check SHA256SUMS
      - name: Publish with npm Trusted Publishing
        run: |
          cd "$RUNNER_TEMP/npm-release-bundle/repository"
          node scripts/publish-release.js "$RUNNER_TEMP/npm-release-bundle/release" --provenance

  verify:
    if: inputs.mode == 'publish'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4
      - name: Download the release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-release-bundle
      - name: Verify the release bundle
        run: cd "$RUNNER_TEMP/npm-release-bundle" && sha256sum --check SHA256SUMS
      - name: Verify registry metadata
        run: |
          cd "$RUNNER_TEMP/npm-release-bundle/repository"
          node scripts/verify-registry-release.js "$RUNNER_TEMP/npm-release-bundle/release" --require-provenance
      - name: Smoke-test fresh Bun and Deno consumers
        run: |
          cd "$RUNNER_TEMP/npm-release-bundle/repository"
          node scripts/smoke-registry-release.ts "$RUNNER_TEMP/npm-release-bundle/release"
