name: Publish npm alpha

on:
  workflow_dispatch:
    inputs:
      release-tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag }}
          fetch-depth: "0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4

      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          case "$RELEASE_TAG" in
            v*-alpha.*) ;;
            *) echo "release tag must match v*-alpha.*" >&2; exit 1 ;;
          esac
          release_version="$(node -p "require('./packages/tsudoi-language-server/package.json').version")"
          test "$RELEASE_TAG" = "v${release_version}"
          tag_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$tag_commit"

      - name: Install shell test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish xonsh zsh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install current publishing tools
        run: |
          npm install --global npm@latest
          bun add --global oxlint@latest oxfmt@latest

      - name: Report publishing tool versions
        run: |
          npm --version
          oxlint --version
          oxfmt --version

      - name: Run the Definition of Done
        run: bun run scripts/definition-of-done.ts

      - name: Pack the release
        run: bun run scripts/pack-release.ts "$RUNNER_TEMP/npm-release"

      - name: Publish with npm Trusted Publishing
        run: bun run scripts/publish-release.ts "$RUNNER_TEMP/npm-release" --provenance
